name: growatt-controller
version: 0.1.0.0
synopsis: Growatt inverter controller for 3-phase surplus energy management
license: MIT

dependencies:
  - base >= 4.14 && < 5
  - time
  - directory
  - libmodbus

ghc-options:
  - -Wall
  - -O2

library:
  source-dirs: src
  exposed-modules:
    - Growatt
    - Switch
    - Controller

executables:
  controller:
    main: Controller.hs
    source-dirs: app
    dependencies:
      - growatt-controller

  main:
    main: Main.hs
    source-dirs: app
    dependencies:
      - growatt-controller
